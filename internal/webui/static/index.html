<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1b1b1f" />
  <title>Sign Pirating</title>
  <!-- MapLibre GL JS from CDN. Free/open; no per-request billing. See README. -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Time-back slider: unobtrusive, logarithmic 7d .. 2y. -->
  <div id="selection" class="panel">
    <label id="timelabel" for="timeslider">90 days</label>
    <input id="timeslider" type="range" min="0" max="1000" value="550" step="1" />
    <span id="reportcount">0</span>
    <label id="showmissinglabel" class="chk" title="show missing"><input id="showmissing" type="checkbox" checked="checked"/>⭕</label>
    <label class="chk" title="show flagged"><input id="insincere" type="checkbox" />⁉️</label>
    <a class="subtle" href="/public-help.html" target="_blank" rel="noopener noreferrer" class="chk" title="help">ℹ️</a>
  </div>

  <!-- Discreet, dismissable bottom sheet. Never blocks the full-screen map. -->
  <div id="sheet" class="sheet hidden" aria-live="polite">
    <button class="sheet-close" aria-label="Dismiss">&times;</button>
    <div id="submitting"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
