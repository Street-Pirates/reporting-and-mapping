# oauth2-proxy CLASSIC config (passed via --config).
#
# Only options that are NOT part of the alpha config live here. Providers,
# upstreams and injected headers are in alpha.yaml.tmpl (--alpha-config).
#
# NO SECRETS in this file. The cookie secret and client credentials come from
# the environment (.env): OAUTH2_PROXY_COOKIE_SECRET and, via the rendered alpha
# template, GOOGLE_/GITHUB_CLIENT_ID/SECRET.

#http_address  = "0.0.0.0:4180"

# Trust X-Forwarded-* from a front proxy/LB (nginx, cloud LB) for client IP, etc.
reverse_proxy = true

# OAuth callback. Both the Google and GitHub OAuth apps must register this exact
# URL. Change the host to your public HTTPS URL in production.
redirect_url  = "http://localhost:40080/oauth2/callback"

# Any authenticated account may sign in (per requester). "*" accepts any email
# domain from either provider.
email_domains = ["*"]

# With two providers, show the chooser page so the user can pick Google/GitHub.
skip_provider_button = false

# Session cookie.
cookie_name   = "_sightingmap_oauth2"
cookie_secure = false      # MUST be true when served over HTTPS in production
cookie_expire = "168h"     # 7 days
cookie_refresh = "60m"
cookie_secret = "ilajkhfalsieufhaes,kfgqwo8f7ygaw"
